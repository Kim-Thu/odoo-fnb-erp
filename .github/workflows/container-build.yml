name: Container Build

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "addons/**"
      - ".github/workflows/container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-container:
    name: build-container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: odoo-fnb-erp:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
